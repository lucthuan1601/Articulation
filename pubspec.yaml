name: articulation
description: "Ứng dụng học tiếng Anh với tính năng phân tích phát âm AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  flutter_svg: ^2.0.17

  # Database - Floor ORM (SQLite)
  floor: ^1.5.0
  sqflite: ^2.4.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Dependency Injection
  get_it: ^8.0.3

  # Audio & Speech
  speech_to_text: ^7.0.0
  record: ^5.2.0
  just_audio: ^0.9.43

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: '>=2.4.8 <2.4.14'
  floor_generator: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/data/
